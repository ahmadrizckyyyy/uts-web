<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Nexus Arena Hub</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NEXUS ARENA HUB</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-sm px-3 mt-1 mt-lg-0" href="register.html">Registrasi</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Form Login -->
  <main class="container my-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 w-100" style="max-width: 420px;">
      <div class="card-body p-4 p-md-5">
        <h1 class="h4 fw-bold text-center mb-1">Login Akun</h1>
        <p class="text-muted text-center small mb-4">Masuk untuk membuka Halaman Menu Utama</p>

        <div id="login-alert"></div>

        <form id="login-form">
          <div class="mb-3">
            <label for="login-username" class="form-label">Username</label>
            <input type="text" class="form-control" id="login-username" placeholder="Masukkan username" required />
          </div>
          <div class="mb-4">
            <label for="login-password" class="form-label">Password</label>
            <input type="password" class="form-control" id="login-password" placeholder="Masukkan password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold">Login</button>
        </form>

        <div class="alert alert-secondary mt-3 mb-0 py-2 px-3 small">
          Akun uji coba default: <strong>admin</strong> / <strong>12345</strong> (atau akun dari hasil Registrasi).
        </div>

        <div class="text-center mt-3 small">
          Belum punya akun? <a href="register.html" class="text-decoration-none fw-semibold">Daftar di sini</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer Wajib -->
  <footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
      <small>@Copyright by 24552011289_Ahmad Rizcky Helmi_TIF RP 24B CID</small>
    </div>
  </footer>

  <!-- Bootstrap 5 JS + Auth JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/auth.js"></script>
</body>
</html>
