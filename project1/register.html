<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi - Nexus Arena Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body class="d-flex flex-column min-vh-100">

  <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NEXUS ARENA HUB</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto gap-2">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Beranda</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary btn-sm px-3 mt-1 mt-lg-0 active" href="register.html">Registrasi</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow border-0">
          <div class="card-body p-4 p-sm-5">
            <div class="text-center mb-4">
              <h1 class="h3 fw-bold mb-1">Registrasi Akun</h1>
              <p class="small mb-0">Isi data di bawah untuk mendaftar akun baru</p>
            </div>

            <div id="register-alert"></div>

            <form id="register-form">
              <div class="mb-3">
                <label for="reg-name" class="form-label fw-semibold">Nama Lengkap</label>
                <input type="text" class="form-control form-control-lg fs-6" id="reg-name"
                  placeholder="Masukkan nama lengkap" required />
              </div>

              <div class="mb-3">
                <label for="reg-username" class="form-label fw-semibold">Username</label>
                <input type="text" class="form-control form-control-lg fs-6" id="reg-username"
                  placeholder="Masukkan username" required />
              </div>

              <div class="mb-3">
                <label for="reg-password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control form-control-lg fs-6" id="reg-password"
                  placeholder="Buat password" required />
              </div>

              <div class="mb-4">
                <label for="reg-confirm" class="form-label fw-semibold">Konfirmasi Password</label>
                <input type="password" class="form-control form-control-lg fs-6" id="reg-confirm"
                  placeholder="Ulangi password" required />
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                Daftar
              </button>
            </form>

            <hr class="my-4" />

            <div class="text-center small">
              Sudah punya akun?
              <a href="login.html" class="text-decoration-none fw-semibold">Login di sini</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center py-3 mt-auto">
    <div class="container">
      <small>@Copyright by 24552011289_Ahmad Rizcky Helmi_TIF RP 24B CID</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/auth.js"></script>
</body>

</html>
